name: opsmanager

services:
  postgres:
    image: postgres:17-alpine
    container_name: opsmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsmanager}
      POSTGRES_USER: ${POSTGRES_USER:-opsmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsmanager_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsmanager} -d ${POSTGRES_DB:-opsmanager}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: opsmanager-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__OpsManager: Host=postgres;Port=5432;Database=${POSTGRES_DB:-opsmanager};Username=${POSTGRES_USER:-opsmanager};Password=${POSTGRES_PASSWORD:-opsmanager_secret}
      Jwt__Issuer: ${JWT_ISSUER:-OpsManager}
      Jwt__Audience: ${JWT_AUDIENCE:-OpsManager.Client}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-signing-key-must-be-at-least-32-bytes-long!}
      Jwt__AccessTokenMinutes: 15
      Jwt__RefreshTokenDays: 30
      Seed__Enabled: ${SEED_ENABLED:-true}
      Seed__Password: ${SEED_PASSWORD:-LocalDevAdminPassword123!}
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://127.0.0.1:3000
      Cors__AllowedOrigins__2: http://localhost
    networks:
      - private
      - public
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: opsmanager-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    networks:
      - public
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: opsmanager-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - public

    depends_on:
      - frontend
      - backend

networks:
  public:
    driver: bridge

  private:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
